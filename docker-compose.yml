services:
  webauth:
    # For local testing, build from Dockerfile instead of pulling from registry
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/popicka70/mrwhooidc:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    environment:
      # Core Configuration
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: https://+:8443;http://+:8080
      ConnectionStrings__authdb: ${CONNECTION_STRING_AUTHDB:-Host=postgres;Port=5432;Database=authdb;Username=oidc;Password=${POSTGRES_PASSWORD};Include Error Detail=false}
      
      # TLS/HTTPS Configuration
      ASPNETCORE_Kestrel__Certificates__Default__Path: ${ASPNETCORE_Kestrel__Certificates__Default__Path:-/https/aspnetapp.pfx}
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD}
      
      # OIDC Configuration
      Oidc__PublicBaseUrl: ${OIDC_PUBLIC_BASE_URL}

      # Forwarded Headers / Reverse Proxy Configuration (Optional)
      ForwardedHeaders__Enabled: ${FORWARDED_HEADERS_ENABLED:-true}
      ForwardedHeaders__RequireHeaderSymmetry: ${FORWARDED_HEADERS_REQUIRE_HEADER_SYMMETRY:-false}
      ForwardedHeaders__ForwardLimit: ${FORWARDED_HEADERS_FORWARD_LIMIT:-1}
      ForwardedHeaders__UnsafeTrustAll: ${FORWARDED_HEADERS_UNSAFE_TRUST_ALL:-false}
      ForwardedHeaders__EnforceHostAllowList: ${FORWARDED_HEADERS_ENFORCE_HOST_ALLOW_LIST:-false}
      ForwardedHeaders__AllowedHosts__0: ${FORWARDED_HEADERS_ALLOWED_HOST_0:-}
      ForwardedHeaders__AllowedHosts__1: ${FORWARDED_HEADERS_ALLOWED_HOST_1:-}
      ForwardedHeaders__AllowedHosts__2: ${FORWARDED_HEADERS_ALLOWED_HOST_2:-}
      ForwardedHeaders__KnownProxies__0: ${FORWARDED_HEADERS_KNOWN_PROXY_0:-}
      ForwardedHeaders__KnownProxies__1: ${FORWARDED_HEADERS_KNOWN_PROXY_1:-}
      ForwardedHeaders__KnownProxies__2: ${FORWARDED_HEADERS_KNOWN_PROXY_2:-}
      ForwardedHeaders__KnownNetworks__0: ${FORWARDED_HEADERS_KNOWN_NETWORK_0:-}
      ForwardedHeaders__KnownNetworks__1: ${FORWARDED_HEADERS_KNOWN_NETWORK_1:-}
      
      # Multi-tenancy is controlled by the installed platform license (deployment_mode).
      
      # Redis Configuration (Optional)
      Redis__Enabled: ${REDIS_ENABLED:-false}
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379,abortConnect=false}
      
      # Email/SMTP Configuration (Optional)
      Mail__Enabled: ${MAIL_ENABLED:-false}
      Mail__SmtpHost: ${MAIL_SMTP_HOST}
      Mail__SmtpPort: ${MAIL_SMTP_PORT:-587}
      Mail__UseSsl: ${MAIL_SMTP_USE_SSL:-true}
      Mail__FromAddress: ${MAIL_FROM_ADDRESS}
      Mail__FromName: ${MAIL_FROM_NAME:-MrWhoOidc}
      Mail__Username: ${MAIL_SMTP_USERNAME}
      Mail__Password: ${MAIL_SMTP_PASSWORD}
      
      # Logging Configuration
      Logging__LogLevel__Default: ${LOGGING_LEVEL:-Information}
      Logging__LogLevel__Microsoft.AspNetCore: ${LOGGING_LEVEL:-Warning}
      
      # DataProtection key-ring encryption (production)
      # Either provide an X.509 certificate to encrypt the key-ring at rest, or explicitly
      # accept the risk of storing it unencrypted in the same database as the signing keys.
      DataProtection__CertificatePath: ${DATAPROTECTION_CERTIFICATE_PATH:-}
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERTIFICATE_PASSWORD:-}
      DataProtection__AllowUnencryptedKeyRingInProduction: ${DATAPROTECTION_ALLOW_UNENCRYPTED_KEY_RING:-false}

      # Bootstrap Configuration (one-time initial setup)
      Bootstrap__Token: ${BOOTSTRAP_TOKEN:-}
    ports:
      - "8443:8443"
      - "8081:8080"  # HTTP port for automatic redirect to HTTPS (mapped to 8081 on host to avoid conflicts)
    volumes:
      - ./certs:/https:ro
    healthcheck:
      # HTTPS readiness check against the OIDC discovery endpoint.
      # curl is present in the noble base image (libgssapi-krb5-2 install step keeps apt lists).
      test: ["CMD-SHELL", "curl -fsS https://localhost:8443/.well-known/openid-configuration -k -o /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal
      - edge

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: oidc
      # Fail closed: postgres requires a non-empty password. The shell-level guard below
      # prevents the stack from starting with an empty/unset POSTGRES_PASSWORD.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong value in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7.2-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true
  edge:
    driver: bridge
