# Starting-point Prometheus alerting rules for MrWhoOidc.
#
# WebAuth has no Prometheus /metrics endpoint. Metrics leave the process only over OTLP
# (set OTEL_EXPORTER_OTLP_ENDPOINT), typically via an OpenTelemetry Collector that exposes or
# remote-writes them to Prometheus. Metric names below assume the Collector's default
# OTel-to-Prometheus translation (dots -> underscores, counters suffixed _total, histogram units
# as suffixes). Verify every name and label against your collected samples, choose thresholds from
# your own baseline, and test each alert before relying on it.
# See alerting-rules.md in this directory.

groups:
  - name: mrwhooidc-application
    rules:
      # Token endpoint failures (instrument: oidc.token.failures / oidc.token.requests).
      # Expected protocol rejections (invalid_grant, invalid_client) are included; tune the threshold.
      - alert: MrWhoOidcTokenFailureRatio
        expr: |
          sum(rate(oidc_token_failures_total[10m]))
            / clamp_min(sum(rate(oidc_token_requests_total[10m])), 1) > 0.2
          and sum(rate(oidc_token_requests_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High token endpoint failure ratio"

      # HTTP 5xx ratio from ASP.NET Core instrumentation (http.server.request.duration).
      - alert: MrWhoOidcHttp5xxRatio
        expr: |
          sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Elevated HTTP 5xx ratio"

      # Back-channel logout queue across all tenants (instrument: oidc.bcl.backlog).
      - alert: MrWhoOidcBackchannelBacklog
        expr: max(oidc_bcl_backlog) > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Back-channel logout notifications are not draining"
          description: "Check /health/backchannel for open circuits and the dispatcher logs."

      # Back-channel logout delivery failures (instrument: oidc.bcl.failed).
      - alert: MrWhoOidcBackchannelFailures
        expr: sum(rate(oidc_bcl_failed_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Back-channel logout deliveries are failing"

      # Telemetry absent: the collector stopped receiving WebAuth metrics.
      - alert: MrWhoOidcTelemetryAbsent
        expr: absent(oidc_authorize_requests_total) and absent(http_server_request_duration_seconds_count)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No MrWhoOidc metrics received"

  # Requires the Prometheus blackbox exporter probing the public host with TLS verification on.
  - name: mrwhooidc-external
    rules:
      - alert: MrWhoOidcDiscoveryDown
        expr: probe_success{job="mrwhooidc-discovery"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Tenant discovery document unreachable"

      - alert: MrWhoOidcTlsCertificateExpiring
        expr: (probe_ssl_earliest_cert_expiry{job="mrwhooidc-discovery"} - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Public TLS certificate expires within 14 days"
