services:
  keygen:
    build:
      context: .
      dockerfile: MrWhoOidc.KeyGen/Dockerfile
    image: mrwhooidc-keygen:latest
    container_name: mrwhooidc-keygen
    ports:
      # Bind to localhost only: KeyGen mounts the licensing private key and is an
      # admin/licensing tool, not a public service. Do not expose it to the network.
      - "127.0.0.1:8090:8080"
    volumes:
      # Database persistence
      - keygen-data:/data
      # Licensing private key (mount your key file here)
      - ./secrets:/secrets:ro
    environment:
      # Production mode: detailed error pages are disabled and HSTS is enabled.
      # KeyGen serves HTTP only on port 8080 (no HTTPS listener configured here);
      # for a real deployment, terminate TLS at a reverse proxy in front of KeyGen.
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__KeyGenDb=Data Source=/data/keygen.db
      - KeyGen__LicensingPrivateKeyPath=/secrets/licensing-private-key.pem
      - ASPNETCORE_URLS=http://+:8080
      # Required: OIDC sign-in. KeyGen refuses to start without it. Users need the
      # platform-admin role (KeyGen__Auth__RequiredRole). Register a client in the IdP
      # with redirect URI <public-keygen-url>/signin-oidc and scopes openid profile email roles.
      - KeyGen__Auth__Authority=${KEYGEN_AUTH_AUTHORITY:?set KEYGEN_AUTH_AUTHORITY to the IdP issuer URL}
      - KeyGen__Auth__ClientId=${KEYGEN_AUTH_CLIENT_ID:?set KEYGEN_AUTH_CLIENT_ID}
      # Optional, for a confidential client. Pass it from the shell or a secret store, not this file.
      - KeyGen__Auth__ClientSecret=${KEYGEN_AUTH_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - keygen-network

networks:
  keygen-network:
    driver: bridge

volumes:
  keygen-data:
    driver: local

# Usage:
# 1. Create secrets directory with licensing key:
#    mkdir secrets
#    # Place your licensing-private-key.pem in secrets/
#
# 2. Build and start (OIDC sign-in is required):
#    KEYGEN_AUTH_AUTHORITY=https://idp.example.com/t/default \
#    KEYGEN_AUTH_CLIENT_ID=mrwho-keygen \
#    docker-compose -f docker-compose-keygen.yml up -d
#
# 3. View logs:
#    docker-compose logs -f keygen
#
# 4. Stop:
#    docker-compose down
#
# 5. Stop and remove volumes (WARNING: deletes database):
#    docker-compose down -v
