services:
  webauth:
    environment:
      Oidc__AllowedCorsOrigins__0: "http://localhost:5173"
      Oidc__AllowedCorsOrigins__1: "http://localhost:3000"
      Oidc__AllowedCorsOrigins__2: "http://localhost:5174"
      Oidc__AllowedCorsOrigins__3: "http://localhost:8088"
      Seeding__Enabled: "true"
      Seeding__ManifestPath: "/seed/portal-seed-manifest.json"
      Seeding__AllowUpdates: "true"
    volumes:
      - ./certs:/https:ro
      - ./dev/portal-seed-manifest.json:/seed/portal-seed-manifest.json:ro

  licensingapi:
    build:
      context: ../MrWhoLicensing
      dockerfile: src/MrWhoLicensing.Api/Dockerfile
    depends_on:
      webauth:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:7443;http://+:7442
      ASPNETCORE_HTTPS_PORTS: 7443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: changeit
      ConnectionStrings__LicensingDb: Data Source=/data/mrwholicensing-dev.db
      Authentication__Oidc__Enabled: "true"
      Authentication__Oidc__Authority: "https://webauth:8443/t/default"
      Authentication__Oidc__JwksUrl: "https://webauth:8443/t/default/jwks"
      Authentication__Oidc__ValidIssuer: "https://localhost:8443/t/default"
      Authentication__Oidc__Audience: ""
      Authentication__Oidc__RequireHttpsMetadata: "true"
      Authentication__Oidc__AllowDevelopmentCertificateBypass: "true"
      Cors__AllowedOrigins__0: "http://localhost:8088"
      LicensingSigning__Issuer: "MrWhoLicensing"
      LicensingSigning__KeyId: "mrwho-licensing-dev"
      LicensingSigning__AllowEphemeralDevelopmentKey: "true"
    ports:
      - "7443:7443"
      - "7442:7442"
    volumes:
      - ./certs:/https:ro
      - licensing-data:/data
    restart: unless-stopped
    networks:
      - internal
      - edge

  portalweb:
    build:
      context: ./MrWhoOidc.Web
      dockerfile: Dockerfile
    depends_on:
      licensingapi:
        condition: service_started
      webauth:
        condition: service_started
    ports:
      - "8088:80"
    restart: unless-stopped
    networks:
      - edge

volumes:
  licensing-data: