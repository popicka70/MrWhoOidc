limit_req_zone $binary_remote_addr zone=portal_per_ip:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    limit_req zone=portal_per_ip burst=60 nodelay;
    limit_req_status 429;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # Customer portal pages handle OAuth tokens: lock them down with a CSP.
    # Keep in sync with the <meta http-equiv="Content-Security-Policy"> in portal*.html.
    location ~ ^/portal[^/]*\.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js; style-src 'self' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/ https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/ https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/ https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /licensing/ {
        proxy_pass http://licensingapi:7442/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oidc/ {
        proxy_pass https://mrwho.onrender.com/;
        proxy_http_version 1.1;
        # Verify the upstream certificate against the system CA bundle shipped in the
        # nginx:alpine image (ca-certificates) and send SNI for the upstream host name.
        proxy_ssl_server_name on;
        proxy_ssl_name mrwho.onrender.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host mrwho.onrender.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}