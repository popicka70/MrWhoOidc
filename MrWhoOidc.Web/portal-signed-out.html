<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Keep in sync with the portal CSP in nginx.default.conf (meta covers hosts without that header). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js; style-src 'self' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/ https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/ https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/ https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <meta name="robots" content="noindex,follow">
    <title>Portal Signed Out</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <link rel="stylesheet" href="css/site.css?v=20260404g">
</head>
<body>
    <script src="js/portal-signed-out.js?v=20261005a"></script>

    <nav data-site-nav="compact"></nav>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4 p-lg-5 text-center">
                            <span class="badge text-bg-secondary mb-3">Signed Out</span>
                            <h1 class="h3 fw-bold mb-3">You are signed out of the customer portal</h1>
                            <p class="text-secondary mb-4">
                                Your portal session has been cleared from this browser.
                                You can sign in again or return to the home page.
                            </p>
                            <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                                <a class="btn btn-accent px-4" href="portal.html">
                                    <i class="bi bi-box-arrow-in-right me-1"></i>Return to portal
                                </a>
                                <a class="btn btn-outline-secondary px-4" href="index.html">
                                    <i class="bi bi-house-door me-1"></i>Go to home page
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/site-nav.js?v=20260517c"></script>
</body>
</html>
