services:
  webauth:
    build:
      context: .
      dockerfile: MrWhoOidc.WebAuth/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8443;http://+:8080
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORT: 8443
      DataProtection__CertificatePath: /https/aspnetapp.pfx
      DataProtection__CertificatePassword: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
      ConnectionStrings__authdb: Host=postgres;Port=5432;Database=authdb;Username=oidc;Password=${DEV_POSTGRES_PASSWORD:?DEV_POSTGRES_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env};Include Error Detail=true
      ConnectionStrings__redis: redis:6379,abortConnect=false
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
      # OIDC configuration
      Oidc__PublicBaseUrl: "https://localhost:8443"
      # Multi-tenancy is configured explicitly via MultiTenancy settings.
      # Mail defaults target MailHog unless overridden via --env-file .env.dev.local.
      # DEV_MAIL_* avoids accidental overrides from the tracked root .env used by other compose workflows.
      Mail__Enabled: "${DEV_MAIL_ENABLED:-true}"
      Mail__SmtpHost: "${DEV_MAIL_SMTP_HOST:-mailhog}"
      Mail__SmtpPort: "${DEV_MAIL_SMTP_PORT:-1025}"
      Mail__UseSsl: "${DEV_MAIL_SMTP_USE_SSL:-false}"
      Mail__FromAddress: "${DEV_MAIL_FROM_ADDRESS:-no-reply@mrwho.local}"
      Mail__FromName: "${DEV_MAIL_FROM_NAME:-MrWhoOidc}"
      Mail__Username: "${DEV_MAIL_SMTP_USERNAME:-}"
      Mail__Password: "${DEV_MAIL_SMTP_PASSWORD:-}"
      # Auto-seed default tenant and admin (dev only, requires explicit opt-in)
      Testing__EnableAutoSeed: "true"
      # Allow external-OIDC discovery/token calls to reach loopback/private hosts
      # (e.g. the localhost upstream authority) in dev/e2e. Safe-by-default OFF in
      # production where the SSRF-safe HTTP client blocks internal addresses.
      Testing__AllowLocalExternalOidcHttp: "true"
      # Enable optional protocol features so the e2e suite can exercise them.
      # Dynamic client registration (RFC 7591/7592) without an initial access token,
      # and CIBA (OpenID Connect Client-Initiated Backchannel Authentication).
      Auth__EnableDynamicClientRegistration: "true"
      Auth__RequireInitialAccessToken: "false"
      Auth__EnableCiba: "true"
      Auth__EnableDelegatedAccess: "true"
      # Dev secrets have no literal defaults: scripts/setup-dev.sh / setup-dev.ps1 generate random values into .env.
      # Auto-seeded admin password (admin@mrwho.local); only applied when the account is first created.
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}"
      # Pin the seeded blazor-web confidential client secret so the example
      # apps (razorclient, oidcdemo) can authenticate. Must match the
      # MrWhoOidc__ClientSecret / OidcSettings__ClientSecret used by those services.
      SEED_BLAZOR_WEB_CLIENT_SECRET: "${DEV_SEED_BLAZOR_WEB_CLIENT_SECRET:?DEV_SEED_BLAZOR_WEB_CLIENT_SECRET is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}"
      SEED_TEST_API_CLIENT_SECRET: "${DEV_SEED_TEST_API_CLIENT_SECRET:?DEV_SEED_TEST_API_CLIENT_SECRET is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}"
      DEV_PFX_TRUST_SOURCE: /https/aspnetapp.pfx
      DEV_PFX_TRUST_PASSWORD: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
    ports:
      - "8443:8443"
      - "8081:8080"
    volumes:
      - ./certs:/https:ro
    # "localhost" also resolves to the host, after 127.0.0.1. Issuer and redirect URLs use
    # https://localhost:<port> for the browser; inside a container, a localhost port that the
    # container itself does not serve (another service's published port) is refused on loopback
    # and the connection falls through to the host. The images run as non-root and do not edit
    # /etc/hosts.
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped
    networks:
      - internal
      - edge

  webauth-upstream:
    build:
      context: .
      dockerfile: MrWhoOidc.WebAuth/Dockerfile
    depends_on:
      postgres-upstream:
        condition: service_healthy
      redis-upstream:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:9443
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORT: 9443
      DataProtection__CertificatePath: /https/aspnetapp.pfx
      DataProtection__CertificatePassword: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
      ConnectionStrings__authdb: Host=postgres-upstream;Port=5432;Database=authdb;Username=oidc;Password=${DEV_POSTGRES_PASSWORD:?DEV_POSTGRES_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env};Include Error Detail=true
      ConnectionStrings__redis: redis-upstream:6379,abortConnect=false
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
      Oidc__PublicBaseUrl: "https://localhost:9443"
      Mail__Enabled: "${DEV_MAIL_ENABLED:-true}"
      Mail__SmtpHost: "${DEV_MAIL_SMTP_HOST:-mailhog}"
      Mail__SmtpPort: "${DEV_MAIL_SMTP_PORT:-1025}"
      Mail__UseSsl: "${DEV_MAIL_SMTP_USE_SSL:-false}"
      Mail__FromAddress: "${DEV_MAIL_FROM_ADDRESS:-no-reply@mrwho.local}"
      Mail__FromName: "${DEV_MAIL_FROM_NAME:-MrWhoOidc}"
      Mail__Username: "${DEV_MAIL_SMTP_USERNAME:-}"
      Mail__Password: "${DEV_MAIL_SMTP_PASSWORD:-}"
      Testing__EnableAutoSeed: "true"
      Testing__AllowLocalExternalOidcHttp: "true"
      Auth__EnableDelegatedAccess: "true"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}"
      DEV_PFX_TRUST_SOURCE: /https/aspnetapp.pfx
      DEV_PFX_TRUST_PASSWORD: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
    ports:
      - "9443:9443"
    volumes:
      - ./certs:/https:ro
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped
    networks:
      - internal
      - edge

  testapi:
    build:
      context: .
      dockerfile: Examples/MrWhoOidc.TestApi/Dockerfile
    depends_on:
      webauth:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:7149;http://+:5149
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORT: 7149
      DataProtection__KeysDirectory: /app/data-protection-keys
      DataProtection__CertificatePath: /https/aspnetapp.pfx
      DataProtection__CertificatePassword: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
      MrWhoOidc__Issuer: "https://localhost:8443/t/default"
      MrWhoOidc__DiscoveryUri: "https://localhost:8443/t/default/.well-known/openid-configuration"
      MrWhoOidc__ClientId: test-api
      MrWhoOidc__ClientSecret: "${DEV_SEED_TEST_API_CLIENT_SECRET:?DEV_SEED_TEST_API_CLIENT_SECRET is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}"
      MrWhoOidc__Audience: api
      MrWhoOidc__RequireHttpsMetadata: "true"
      DEV_PFX_TRUST_SOURCE: /https/aspnetapp.pfx
      DEV_PFX_TRUST_PASSWORD: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "7149:7149"
      - "5149:5149"
    volumes:
      - ./certs:/https:ro
      - testapi-data-protection:/app/data-protection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5149/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - edge

  razorclient:
    build:
      context: .
      dockerfile: Examples/MrWhoOidc.RazorClient/Dockerfile
    depends_on:
      webauth:
        condition: service_started
      testapi:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:5003;http://+:5002
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORT: 5003
      DataProtection__KeysDirectory: /app/data-protection-keys
      DataProtection__CertificatePath: /https/aspnetapp.pfx
      DataProtection__CertificatePassword: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
      MrWhoOidc__Issuer: "https://localhost:8443/t/default"
      MrWhoOidc__DiscoveryUri: "https://localhost:8443/t/default/.well-known/openid-configuration"
      MrWhoOidc__ClientId: blazor-web
      MrWhoOidc__ClientSecret: "${DEV_SEED_BLAZOR_WEB_CLIENT_SECRET:?DEV_SEED_BLAZOR_WEB_CLIENT_SECRET is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}"
      MrWhoOidc__RequireHttpsMetadata: "true"
      TestApi__BaseAddress: https://localhost:7149
      DEV_PFX_TRUST_SOURCE: /https/aspnetapp.pfx
      DEV_PFX_TRUST_PASSWORD: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "5003:5003"
      - "5002:5002"
    volumes:
      - ./certs:/https:ro
      - razorclient-data-protection:/app/data-protection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5002/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - edge

  oidcdemo:
    build:
      context: .
      dockerfile: Examples/MrWhoOidc.OidcDemo/Dockerfile
    depends_on:
      webauth:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:5001;http://+:5000
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORT: 5001
      DataProtection__KeysDirectory: /app/data-protection-keys
      DataProtection__CertificatePath: /https/aspnetapp.pfx
      DataProtection__CertificatePassword: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
      OidcSettings__Authority: "https://localhost:8443/t/default"
      OidcSettings__DiscoveryUri: "https://localhost:8443/t/default/.well-known/openid-configuration"
      OidcSettings__ClientId: blazor-web
      OidcSettings__ClientSecret: "${DEV_SEED_BLAZOR_WEB_CLIENT_SECRET:?DEV_SEED_BLAZOR_WEB_CLIENT_SECRET is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}"
      DEV_PFX_TRUST_SOURCE: /https/aspnetapp.pfx
      DEV_PFX_TRUST_PASSWORD: ${DEV_CERT_PASSWORD:?DEV_CERT_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "5001:5001"
      - "5000:5000"
    volumes:
      - ./certs:/https:ro
      - oidcdemo-data-protection:/app/data-protection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - edge

  reactclient:
    build:
      context: ./Examples/ReactOidcClient
      dockerfile: Dockerfile
      args:
        VITE_OIDC_AUTHORITY: "https://localhost:8443/t/default"
        VITE_OIDC_CLIENT_ID: react-demo
        VITE_REDIRECT_URI: "http://localhost:5173/callback"
        VITE_POST_LOGOUT_REDIRECT_URI: "http://localhost:5173/"
    depends_on:
      webauth:
        condition: service_started
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - edge

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: oidc
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?DEV_POSTGRES_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  postgres-upstream:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: oidc
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?DEV_POSTGRES_PASSWORD is not set; run scripts/setup-dev.sh or scripts/setup-dev.ps1 to generate .env}
    volumes:
      - postgres-upstream-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7.2-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal

  redis-upstream:
    image: redis:7.2-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-upstream-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      # Loopback only: the MailHog UI shows every password-reset and verification mail. Containers reach it as "mailhog".
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    networks:
      - internal
      - edge

volumes:
  postgres-data:
  postgres-upstream-data:
  redis-data:
  redis-upstream-data:
  testapi-data-protection:
  razorclient-data-protection:
  oidcdemo-data-protection:

networks:
  internal:
    driver: bridge
    internal: true
  edge:
    driver: bridge
