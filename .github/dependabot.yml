version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 10

  # Workflow actions are pinned to commit SHAs (with a "# vX.Y.Z" comment);
  # Dependabot bumps the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/MrWhoOidc.WebAuth"
      - "/MrWhoOidc.KeyGen"
      - "/MrWhoOidc.Web"
      - "/Examples/MrWhoOidc.OidcDemo"
      - "/Examples/MrWhoOidc.RazorClient"
      - "/Examples/MrWhoOidc.TestApi"
      - "/Examples/ReactOidcClient"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 10
