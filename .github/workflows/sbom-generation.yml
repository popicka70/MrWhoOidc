name: Generate SBOM

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]
  workflow_dispatch:

# Read-only by default (this workflow also runs on pull requests). Only the
# release-only attach job below is granted contents: write.
permissions:
  contents: read

jobs:
  generate-sbom:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '10.x'
        
    - name: Restore dependencies
      run: dotnet restore MrWhoOidc.slnx
      
    - name: Generate SBOM
      shell: pwsh
      run: |
        .\generate-sbom-comprehensive.ps1
        
    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: sbom-files
        path: sbom/
        retention-days: 90
        if-no-files-found: error
        
    - name: Create SBOM summary
      shell: pwsh
      run: |
        $sbomSummary = Get-Content sbom/all-dependencies.txt -Raw
        $projectCount = (Get-ChildItem sbom/projects/*.json).Count
        
        Write-Output "## SBOM Generation Summary" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "✅ Successfully generated SBOM files for **$projectCount projects**" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "### Files Generated:" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "- Solution-wide SBOM" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "- Per-project SBOMs" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "- Dependency reports" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "- Consolidated dependency list" >> $env:GITHUB_STEP_SUMMARY
        
  # Attach the SBOM to published releases. Separate job so that only this
  # release-triggered job ever holds a write-scoped token.
  attach-sbom-to-release:
    if: github.event_name == 'release'
    needs: generate-sbom
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download SBOM artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: sbom-files
        path: sbom

    - name: Attach SBOM to Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        files: |
          sbom/MrWhoOidc.Solution.sbom.json
          sbom/all-dependencies.txt
        fail_on_unmatched_files: true
